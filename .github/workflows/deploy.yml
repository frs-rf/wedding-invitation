name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 30m
          # Ubah "cd /var/www/wedding-invitation/app" di bawah ini 
          # ke path instalasi Anda sebenarnya di dalam VPS.
          script: |
            cd /var/www/wedding-invitation/app
            
            # Pull latest changes
            git pull origin main
            
            # Ensure DB environment variables are loaded
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Rebuild and extract assets
            docker compose pull || true
            docker compose build
            
            # Extract compiled frontend assets from the new image to host's public directory
            docker run --rm -v $(pwd)/public:/export wedding-invitation-app cp -a /var/www/html/public/build /export/ || true
            
            docker compose up -d
            
            # Run migrations inside the app container
            docker compose exec -T app php artisan migrate --force
            
            # Clear caches
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan event:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            
            # Restart queue worker container
            docker compose restart worker
            
            echo "Docker Deployment to VPS completed successfully!"
