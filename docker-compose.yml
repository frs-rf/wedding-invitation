version: '3.8'
services:
  # Laravel Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wedding-invitation-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - wedding-network
    depends_on:
      - db

  # Nginx Web Server
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wedding-network
    depends_on:
      - app

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wedding_invitation}
      POSTGRES_USER: ${DB_USERNAME:-mac}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - wedding-network
    ports:
      - "5432:5432"

  # Queue Worker
  worker:
    image: wedding-invitation-app
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - wedding-network
    depends_on:
      - app
      - db

networks:
  wedding-network:
    driver: bridge

volumes:
  db-data:
